name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Create Capacitor project
        run: |
          mkdir -p www
          cp todo-app.html www/index.html
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/local-notifications@6
          npx cap init "مهامي" com.mohami.app --web-dir=www
          npx cap add android
          F=$(find node_modules/@capacitor/local-notifications/android -name LocalNotificationManager.java)
          sed -i 's/Notification buildNotification = mBuilder.build();/Notification buildNotification = mBuilder.build(); buildNotification.flags |= android.app.Notification.FLAG_INSISTENT;/' "$F"
          grep -q FLAG_INSISTENT "$F" || echo "::warning::insistent patch not applied"
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/>\n    <uses-permission android:name="android.permission.USE_EXACT_ALARM"/>\n    <uses-permission android:name="android.permission.VIBRATE"/>\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>\n    <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS"/>\n</manifest>#' android/app/src/main/AndroidManifest.xml
          mkdir -p android/app/src/main/java/com/mohami/app
          cat > android/app/src/main/java/com/mohami/app/MainActivity.java << 'EOF'
          package com.mohami.app;

          import android.content.Context;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.PowerManager;
          import android.provider.Settings;

          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  try {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                          String packageName = getPackageName();
                          PowerManager pm = (PowerManager) getSystemService(Context.POWER_SERVICE);
                          if (pm != null && !pm.isIgnoringBatteryOptimizations(packageName)) {
                              Intent intent = new Intent(Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS);
                              intent.setData(Uri.parse("package:" + packageName));
                              startActivity(intent);
                          }
                      }
                  } catch (Exception e) {
                  }
              }
          }
          EOF
          mkdir -p android/app/src/main/res/raw android/app/src/main/res/drawable
          cat > android/app/src/main/res/drawable/ic_stat.xml << 'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
            <path android:fillColor="#FFFFFFFF" android:pathData="M12,2a10,10 0 1,0 0,20a10,10 0 1,0 0,-20zM10.5,16.5l-4,-4l1.4,-1.4l2.6,2.6l5.6,-5.6l1.4,1.4z"/>
          </vector>
          EOF
          python3 - << 'PY'
          import wave, struct, math
          sr = 22050
          base = [(784, 0), (988, .3), (1175, .6), (1568, .9), (1175, 1.6), (1568, 1.9), (1976, 2.2)]
          notes = [(f, t + 4.2 * k) for k in range(8) for f, t in base]
          buf = [0.0] * int(sr * 4.2 * 8)
          for f, t in notes:
              s = int(t * sr)
              for i in range(min(int(sr * 1.8), len(buf) - s)):
                  x = i / sr
                  buf[s + i] += math.exp(-2.6 * x) * min(1, x * 90) * (math.sin(6.2832 * f * x) + .35 * math.sin(12.5664 * f * x))
          m = max(abs(v) for v in buf)
          w = wave.open('android/app/src/main/res/raw/reminder.wav', 'wb')
          w.setnchannels(1); w.setsampwidth(2); w.setframerate(sr)
          w.writeframes(b''.join(struct.pack('<h', int(v / m * 30000)) for v in buf))
          w.close()
          PY
          pip install -q pillow
          python3 - << 'PY2'
          from PIL import Image
          import glob
          ic = Image.open('icon.png').convert('RGBA')
          for d, n in [('mdpi',48),('hdpi',72),('xhdpi',96),('xxhdpi',144),('xxxhdpi',192)]:
              r = ic.resize((n, n), Image.LANCZOS)
              for f in ('ic_launcher','ic_launcher_round','ic_launcher_foreground'):
                  r.save(f'android/app/src/main/res/mipmap-{d}/{f}.png')
          for f in glob.glob('android/app/src/main/res/drawable*/splash.png'):
              w, h = Image.open(f).size
              bg = Image.new('RGBA', (w, h), (32, 14, 88, 255))
              s = int(min(w, h) * .38)
              r = ic.resize((s, s), Image.LANCZOS)
              bg.paste(r, ((w - s) // 2, (h - s) // 2), r)
              bg.convert('RGB').save(f)
          PY2
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          npx cap sync android
      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: mohami-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
