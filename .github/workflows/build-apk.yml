          from PIL import Image
          import glob
          ic = Image.open('icon.png').convert('RGBA')
          for d, n in [('mdpi',48),('hdpi',72),('xhdpi',96),('xxhdpi',144),('xxxhdpi',192)]:
              r = ic.resize((n, n), Image.LANCZOS)
              for f in ('ic_launcher','ic_launcher_round','ic_launcher_foreground'):
                  r.save(f'android/app/src/main/res/mipmap-{d}/{f}.png')
          for f in glob.glob('android/app/src/main/res/drawable*/splash.png'):
              w, h = Image.open(f).size
              bg = Image.new('RGBA', (w, h), (8, 13, 28, 255))
              s = int(min(w, h) * .38)
              r = ic.resize((s, s), Image.LANCZOS)
              bg.paste(r, ((w - s) // 2, (h - s) // 2), r)
              bg.convert('RGB').save(f)
